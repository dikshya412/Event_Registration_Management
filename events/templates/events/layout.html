{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <title>{% block title %}Kailali Multiple Campus {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="nav-inner">
            <a class="brand" href="{% url 'event_list' %}">

    <main class="container">

        CampusConnect · Campus Event Registration and Management System
    </footer>
</body>
</html>
