<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
</head>
<body>
    {% if event %}
        <h1>Edit Event</h1>
    {% else %}
        <h1>Create Event</h1>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            {% if event %}
                Update Event
            {% else %}
                Create Event
            {% endif %}
        </button>
    </form>
    <br>
    <a href="{% url 'event_list' %}">← Back to Events</a>
</body>
</html>
